<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial - Jarvis</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="jarvis-container">

    <header class="jarvis-header">
        <h1>Historial</h1>
        <div class="header-right">
            <span class="user-email">{{ current_user_email }}</span>
            <a href="{{ url_for('index') }}" class="btn-history">← Volver</a>
            <a href="{{ url_for('logout') }}" class="btn-logout">Salir</a>
        </div>
    </header>

    <div class="history-list">
        {% for m in messages %}
            <div class="message {{ 'user' if m.role == 'user' else 'jarvis' }}">
                <small>{{ m.created_at[:16].replace('T', ' ') }}</small>
                <p>{{ m.message }}</p>
            </div>
        {% else %}
            <p class="empty">Aún no hay conversaciones.</p>
        {% endfor %}
    </div>

</div>

</body>
</html>
